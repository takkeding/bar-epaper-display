# ----------------------------------------------------------------------------
# Display
# ----------------------------------------------------------------------------
display:
  - platform: waveshare_epaper
    id: epaper_display
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    rotation: 0
    model: "7.50inv2p"
    update_interval: never
    full_update_every: 30

    lambda: |-
      const auto COLOR_WHITE = Color(0, 0, 0);       // Inverted for e-ink
      const auto COLOR_BLACK = Color(255, 255, 255); // Inverted for e-ink

      // Word-wrap printer. draw=false only counts lines (used for centering).
      auto print_wrapped_text = [&](int x, int y, int max_w, int line_h, esphome::font::Font *font,
                                    Color color, TextAlign align, const char* text, bool draw) -> int {
        if (!text || max_w <= 0) return 0;
        int lines = 0;
        int cy = y;
        std::string line, word;
        auto width_of = [&](const std::string &s) {
          int w, xo, bl, h; font->measure(s.c_str(), &w, &xo, &bl, &h); return w;
        };
        auto flush_word = [&]() {
          if (word.empty()) return;
          std::string candidate = line.empty() ? word : line + " " + word;
          if (!line.empty() && width_of(candidate) > max_w) {
            if (draw) it.print(x, cy, font, color, align, line.c_str());
            cy += line_h; lines++;
            line = word;
          } else {
            line = candidate;
          }
          word.clear();
        };
        for (const char *p = text; *p; p++) {
          if (*p == ' ' || *p == '\n' || *p == '\r' || *p == '\t') flush_word();
          else word += *p;
        }
        flush_word();
        if (!line.empty()) {
          if (draw) it.print(x, cy, font, color, align, line.c_str());
          lines++;
        }
        return lines;
      };

      // Quote centred horizontally AND vertically in the area above the footer
      auto draw_quote = [&](const std::string &txt) {
        const int top = 10, height = 400, line_h = 90;
        auto *f = id(font_roboto_400_80);
        int lines = print_wrapped_text(400, 0, 760, line_h, f, COLOR_BLACK, TextAlign::TOP_CENTER, txt.c_str(), false);
        int y = top + (height - lines * line_h) / 2;
        if (y < top) y = top;
        print_wrapped_text(400, y, 760, line_h, f, COLOR_BLACK, TextAlign::TOP_CENTER, txt.c_str(), true);
      };

      // QR on the left, caption on the right
      auto draw_qr_page = [&](esphome::qr_code::QrCode *qr, const std::string &caption) {
        int scale = 380 / qr->get_size();
        if (scale < 1) scale = 1;
        it.qr_code(20, 20, qr, COLOR_BLACK, scale);
        print_wrapped_text(420, 20, 370, 90, id(font_roboto_400_80), COLOR_BLACK,
                           TextAlign::TOP_LEFT, caption.c_str(), true);
      };

      it.fill(COLOR_WHITE);
      if (id(low_battery)) {
        // Battery empty: payment QR + fixed charge message, vertically centred next to it
        auto *qr = id(qr_bier);
        int scale = 380 / qr->get_size();
        if (scale < 1) scale = 1;
        it.qr_code(20, 20, qr, COLOR_BLACK, scale);
        const char *msg = "Mijn batterij is leeg. Betaal via deze link en zorg dat ik weer opgeladen wordt :(";
        auto *f = id(font_roboto_400_35);
        int lines = print_wrapped_text(420, 0, 360, 45, f, COLOR_BLACK, TextAlign::TOP_LEFT, msg, false);
        int y = 10 + (400 - lines * 45) / 2;
        print_wrapped_text(420, y, 360, 45, f, COLOR_BLACK, TextAlign::TOP_LEFT, msg, true);
      } else switch (id(display_page)) {
        case 0: draw_qr_page(id(qr_bier), id(c_bier_text).state); break;
        case 1: draw_quote(id(c_quote_1).state); break;
        case 2: draw_quote(id(c_quote_2).state); break;
        case 3: draw_qr_page(id(wifi_qr), id(c_wifi_text).state); break;
        case 4: draw_quote(id(c_quote_3).state); break;
      }

      // ───────────────────────── FOOTER ─────────────────────────
      {
        // Rounded border
        auto draw_rrect_border = [&](int x, int y, int w, int h, int r, int t, Color c) {
          it.filled_rectangle(x + r, y, w - 2 * r, t, c);
          it.filled_rectangle(x + r, y + h - t, w - 2 * r, t, c);
          it.filled_rectangle(x, y + r, t, h - 2 * r, c);
          it.filled_rectangle(x + w - t, y + r, t, h - 2 * r, c);
          for (int dx = 0; dx <= r; dx++) {
            for (int dy = 0; dy <= r; dy++) {
              int ds = dx * dx + dy * dy;
              if (ds <= r * r && ds > (r - t) * (r - t)) {
                it.draw_pixel_at(x + r - dx, y + r - dy, c);
                it.draw_pixel_at(x + w - r + dx - 1, y + r - dy, c);
                it.draw_pixel_at(x + r - dx, y + h - r + dy - 1, c);
                it.draw_pixel_at(x + w - r + dx - 1, y + h - r + dy - 1, c);
              }
            }
          }
        };
        draw_rrect_border(5, 415, 790, 60, 10, 4, COLOR_BLACK);

        // Wind
        it.printf(22, 425, id(font_material_design_icons_400_40), COLOR_BLACK, "%s", "\U000F059D");
        float wind = id(sensor_buienradar_wind_force).state;
        if (isnan(wind)) it.print(70, 425, id(font_roboto_400_35), COLOR_BLACK, "-");
        else it.printf(70, 425, id(font_roboto_400_35), COLOR_BLACK, "%.0f", wind);

        // Feels-like temperature
        it.printf(200, 425, id(font_material_design_icons_400_40), COLOR_BLACK, "%s", "\U000F050F");
        float temp = id(sensor_buienradar_feel_temperature).state;
        if (isnan(temp)) it.print(240, 425, id(font_roboto_400_35), COLOR_BLACK, "--°C");
        else it.printf(240, 425, id(font_roboto_400_35), COLOR_BLACK, "%.1f°C", temp);

        // Weather icon
        {
          std::string ws = id(weather_forecast_home).state;
          auto has = [&](const char *s) { return ws.find(s) != std::string::npos; };
          const char *icon = "\U000F0599";
          if (has("klar") || has("zonnig") || ws == "sunny") icon = "\U000F0599";
          else if (has("lichtbewolkt") || ws == "partlycloudy") icon = "\U000F0595";
          else if (ws == "bewolkt" || ws == "cloudy") icon = "\U000F0590";
          else if (has("mist") || has("fog")) icon = "\U000F0591";
          else if (has("hagel") || ws == "hail") icon = "\U000F0592";
          else if (has("onweer") || has("lightning")) icon = "\U000F0593";
          else if (has("regen") || ws == "rainy" || ws == "pouring") icon = "\U000F0597";
          else if (has("sneeuw") || has("snowy")) icon = "\U000F0598";
          else if (has("nacht") || ws == "clear-night") icon = "\U000F0594";
          it.printf(400, 420, id(font_material_design_icons_400_48), COLOR_BLACK, "%s", icon);
        }

        // Time of this refresh
        auto now = id(ha_time).now();
        if (now.is_valid())
          it.strftime(560, 425, id(font_roboto_700_35), COLOR_BLACK, TextAlign::TOP_CENTER, "%H:%M", now);

        // WiFi
        {
          const char *wifi_icon = "\U000F092B";
          float sig = id(wifi_signal_dbm).state;
          if (!isnan(sig)) {
            if (sig >= -50) wifi_icon = "\U000F0928";
            else if (sig >= -60) wifi_icon = "\U000F0925";
            else if (sig >= -75) wifi_icon = "\U000F0922";
            else wifi_icon = "\U000F091F";
            it.printf(720 + 12, 425 + 26, id(font_roboto_400_12), COLOR_BLACK, TextAlign::TOP_CENTER, "%.0fdB", sig);
          }
          it.printf(720, 425, id(font_material_design_icons_400_24), COLOR_BLACK, "%s", wifi_icon);
        }

        // Battery
        {
          float bat = id(battery_level).state;
          if (isnan(bat)) bat = 0;
          const char *bat_icon =
              bat >= 95 ? "\U000F0079" : bat >= 85 ? "\U000F0082" : bat >= 75 ? "\U000F0081" :
              bat >= 65 ? "\U000F0080" : bat >= 55 ? "\U000F007F" : bat >= 45 ? "\U000F007E" :
              bat >= 35 ? "\U000F007D" : bat >= 25 ? "\U000F007C" : bat >= 15 ? "\U000F007B" :
              bat >= 5  ? "\U000F007A" : "\U000F0083";
          it.printf(760, 425, id(font_material_design_icons_400_24), COLOR_BLACK, "%s", bat_icon);
          it.printf(760 + 12, 425 + 26, id(font_roboto_400_12), COLOR_BLACK, TextAlign::TOP_CENTER, "%.0f%%", bat);
        }
      }
